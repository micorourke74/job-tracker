<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0;
    }

    .header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 16px 12px;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 22px;
      height: 22px;
      background: #6366f1;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.01em;
    }

    .tagline {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .body {
      padding: 14px 16px;
    }

    .preview-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .preview-card.empty {
      align-items: center;
      justify-content: center;
    }

    .preview-placeholder {
      font-size: 11px;
      color: #475569;
      text-align: center;
    }

    .preview-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-company {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .tag {
      font-size: 10px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 1px 6px;
    }

    .tag.highlight {
      background: #1e3a5f;
      color: #93c5fd;
      border-color: #2563eb44;
    }

    .btn-primary {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
      margin-bottom: 8px;
    }

    .btn-primary:hover:not(:disabled) { background: #4f46e5; }

    .btn-primary:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-primary.loading {
      background: #334155;
      cursor: wait;
    }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid #64748b;
      border-top-color: #94a3b8;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    .loading .spinner { display: block; }
    .loading .btn-label { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-row {
      display: flex;
      justify-content: center;
    }

    .btn-link {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      text-decoration: none;
      transition: color 0.15s;
    }

    .btn-link:hover { color: #a5b4fc; text-decoration: underline; }

    .status-area {
      min-height: 26px;
      margin-top: 10px;
    }

    .status-msg {
      font-size: 11px;
      border-radius: 6px;
      padding: 5px 10px;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .status-msg.visible { display: flex; }

    .status-msg.success {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
    }

    .status-msg.error {
      background: #2d1515;
      color: #f87171;
      border: 1px solid #7f1d1d;
    }

    .status-msg.info {
      background: #1e2a3a;
      color: #93c5fd;
      border: 1px solid #1d4ed844;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="logo">📋</div>
      <h1>Job Tracker Clipper</h1>
    </div>
    <p class="tagline">Save the current job listing to Job Tracker.</p>
  </div>

  <div class="body">
    <div class="preview-card empty" id="previewCard">
      <p class="preview-placeholder">Click "Save this job" to extract details</p>
    </div>

    <button class="btn-primary" id="saveBtn">
      <div class="spinner"></div>
      <span class="btn-label">Save this job</span>
    </button>

    <div class="footer-row">
      <button class="btn-link" id="openAppBtn">Open Job Tracker</button>
    </div>

    <div class="status-area">
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
